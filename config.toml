# Configuração administrativa. O chat não altera estes valores.
# Preços de referência: https://developers.openai.com/api/docs/models/gpt-5.4-nano
# Modelo com snapshot fixo; sem fallback automático para outro modelo/provedor.
model = "gpt-5.4-nano-2026-03-17"
input_usd_per_million = "0.20"
output_usd_per_million = "1.25"
# Referência conservadora para o controle local, não uma cotação financeira.
brl_per_usd = "7.00"
price_margin = "1.20"
max_cost_brl = "0.05"
max_input_tokens = 1024
max_context_tokens = 8192
max_output_tokens = 512
timeout_seconds = 60
max_errors = 7
session_seconds = 900
confirmation_seconds = 120
max_requests_per_session = 60
max_requests_per_minute = 10
